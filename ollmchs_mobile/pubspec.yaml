name: ollmchs_library
description: OLLMCHS Library Management System - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  
  # Networking
  dio: ^5.7.0
  
  # Routing
  go_router: ^15.1.2
  
  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  
  # Notifications
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^19.0.0
  
  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  
  # QR & Barcode
  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0
  
  # Biometrics
  local_auth: ^2.3.0

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  
  # Firebase
  firebase_core: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
