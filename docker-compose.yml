version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollmchs-library:latest
    container_name: ollmchs-library-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-database}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-ollmchs_library}"
      DB_USERNAME: "${DB_USERNAME:-ollmchs}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-library@ollmchs.ac.ke}"
      MAIL_FROM_NAME: "${APP_NAME:-OLLMCHS Library}"
      TWO_FACTOR_ENABLED: "true"
    volumes:
      - ollmchs-storage:/var/www/html/storage
      - ollmchs-public:/var/www/html/public/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ollmchs-network

  database:
    image: mysql:8.0
    container_name: ollmchs-library-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ollmchs_library}"
      MYSQL_USER: "${DB_USERNAME:-ollmchs}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - ollmchs-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ollmchs-network

  cache:
    image: redis:7-alpine
    container_name: ollmchs-library-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ollmchs-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ollmchs-network

volumes:
  ollmchs-storage:
  ollmchs-public:
  ollmchs-db:
  ollmchs-cache:

networks:
  ollmchs-network:
    driver: bridge
